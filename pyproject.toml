[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scheme-finder-line"
version = "0.1.0"
description = "Government Scheme Voice Assistant for Gnani AI Internship Challenge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "websockets>=13.1,<14",
    "httpx>=0.28,<0.29",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "audioop-lts>=0.2,<0.3",
    "pydub>=0.25,<0.26",
    "numpy>=2.1,<3",
    "python-dotenv>=1.0,<2",
    "structlog>=24.4,<25",
    "loguru>=0.7,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "ruff>=0.7,<1",
    "mypy>=1.13,<2",
    "pre-commit>=3.8,<4",
]
database = [
    "asyncpg>=0.29,<0.30",
    "sqlalchemy[asyncio]>=2.0,<3",
    "pgvector>=0.2,<0.3",
    "redis>=5.2,<6",
]
nlp = [
    "sentence-transformers>=3.3,<4",
    "torch>=2.14,<3",
    "transformers>=4.46,<5",
]
telephony = [
    "twilio>=9.4,<10",
]
all = [
    "scheme-finder-line[dev,database,nlp,telephony]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --import-mode=append"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true